<title>3 Body Problem Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one screen. A quiet rail of mode and utility buttons on top, the flame digits alone on a
   black stage, one row of transport controls underneath. The sound desk docks beside the stage on
   wide screens and below the controls on a phone, so nothing ever overlaps. */
:root {
  color-scheme: dark;
  --bg: #000;
  --ink: #ecdcc4;
  --ink-dim: #a8957c;
  --line: rgba(255, 170, 90, .22);
  --line-strong: rgba(255, 184, 108, .52);
  --ember: #ff9a3c;
  --gold: #ffd48a;
  --wash: rgba(255, 150, 60, .1);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow-x: hidden;
  background: var(--bg); color: var(--ink);
  font: 14px/1.35 var(--font-ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app {
  height: 100%; min-height: 330px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(140px, 1fr) auto auto;
}
.bar, .controls, .sound { transition: opacity .5s ease; }

/* top rail */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  padding-block: 12px 6px; padding-left: var(--gut-l); padding-right: var(--gut-r);
}
.seg { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 20px; }
.seg-btn {
  position: relative; min-height: 32px; padding: 0 13px; border: 0; border-radius: 999px; background: transparent;
  color: var(--ink-dim); cursor: pointer; white-space: nowrap; transition: color .15s, background-color .15s;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn[aria-pressed="true"] { background: var(--wash); color: var(--gold); }
.dot { display: none; position: absolute; top: 4px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--ember); }
.seg-btn.live .dot, .seg-btn.done .dot { display: inline-block; }
.seg-btn.done .dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }

.btn {
  min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent;
  color: var(--ink-dim); cursor: pointer; white-space: nowrap; letter-spacing: .01em;
  transition: color .15s, border-color .15s, background-color .15s;
}
.btn:hover:not(:disabled) { color: var(--ink); border-color: var(--line-strong); }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { color: var(--gold); border-color: var(--line-strong); background: var(--wash); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.primary { min-width: 104px; color: var(--ink); border-color: var(--line-strong); }
.btn.primary:hover:not(:disabled) { background: var(--wash); color: var(--gold); }
.btn.small { min-height: 30px; padding: 0 11px; font-size: 13px; }

/* stage */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#view {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  /* stray strands fade out at the stage edge instead of being cut */
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14px, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 14px, #000 calc(100% - 14px), transparent);
}
.status {
  position: absolute; left: 0; top: 0; margin: 0; transform: translateY(-50%);
  font: 12px/1 var(--font-data); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
  color: var(--ink-dim); pointer-events: none; transition: color .4s;
}
.status.hot { color: var(--gold); }

/* transport */
.controls { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 6px 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.credit { margin: 0; font: 11px/1 var(--font-data); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
.panel { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 12px 16px; margin: 0; }
.group { display: flex; align-items: flex-end; gap: 8px; }
.field { display: grid; gap: 4px; justify-items: center; }
.field span, .label { font: 11px/1 var(--font-data); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.field input {
  width: 68px; height: 38px; padding: 0 4px; text-align: center;
  font: 16px/1 var(--font-data); font-variant-numeric: tabular-nums;
  color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px;
}
.field input:hover:not(:disabled) { border-color: var(--line-strong); }
.field input:disabled { opacity: .45; }

/* sound desk */
.sound {
  padding-block: 14px 18px; padding-left: var(--gut-l); padding-right: var(--gut-r);
  border-top: 1px solid var(--line); overflow-y: auto; max-height: min(46vh, 430px);
}
.sound-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sound h2 { margin: 0; font: 600 13px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--ink-dim); max-width: 46ch; }
.note { margin: 0; max-width: 54ch; text-align: center; font-size: 13px; line-height: 1.45; color: var(--ink-dim); text-wrap: balance; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sound-sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 5px 22px; margin-top: 12px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; min-width: 0; }
.row label { font-size: 13px; color: var(--ink); }
.row output { font: 12px/1 var(--font-data); color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row input { grid-column: 1 / -1; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: var(--line-strong); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border: 0; border-radius: 50%; background: var(--ember); }
input[type="range"]::-moz-range-track { height: 2px; border-radius: 2px; background: var(--line-strong); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ember); }
input[type="range"]:focus-visible { outline-offset: 0; border-radius: 8px; }

@media (max-width: 760px) {
  .bar { justify-content: center; }
}
@media (max-width: 480px) {
  .seg-btn { padding: 0 10px; }
}
@media (max-width: 520px) {
  /* five modes don't fit one row on a phone: three over two, centred, equal widths */
  .bar .seg { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 400px; }
  .bar .seg .seg-btn { grid-column: span 2; padding: 0 4px; }
  .bar .seg .seg-btn:nth-child(4) { grid-column: 2 / span 2; }
}
@media (max-width: 380px) {
  .tools { gap: 4px; }
  .tools .btn { padding: 0 9px; font-size: 13px; }
  .seg-btn { padding: 0 8px; font-size: 13px; }
}
@media (max-width: 340px) {
  .seg-btn { padding: 0 6px; font-size: 12px; }
}
@media (min-width: 900px), (orientation: landscape) and (min-width: 640px) and (max-height: 520px) {
  .app.tuning { grid-template-columns: minmax(0, 1fr) 316px; grid-template-rows: auto minmax(140px, 1fr) auto; }
  .app.tuning .bar { grid-column: 1 / -1; }
  .app.tuning .sound { grid-column: 2; grid-row: 2 / 4; max-height: none; min-height: 0; border-top: 0; border-left: 1px solid var(--line); padding-left: 20px; }
  .app.tuning .sliders { grid-template-columns: 1fr; }
}
@media (orientation: landscape) and (max-height: 520px) and (min-width: 640px) and (max-width: 899px) {
  /* a phone on its side with Settings open: slimmer panel, so the timer controls keep their row */
  .app.tuning { grid-template-columns: minmax(0, 1fr) min(316px, 36vw); grid-template-rows: auto minmax(100px, 1fr) auto; }
  .app.tuning .field input { width: 58px; }
}

/* full screen: the chrome fades away while nothing is being touched */
body.idle { cursor: none; }
body.idle .bar, body.idle .controls, body.idle .sound { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .bar, .controls, .sound, .status, .btn, .seg-btn { transition: none; } }
</style>

<script>
(function () {
'use strict';

/* ───────────────────────── helpers ───────────────────────── */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const smooth = t => t * t * (3 - 2 * t);
const pad2 = n => (n < 10 ? '0' : '') + n;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────────────────── timekeeping state ─────────────────────────
   Everything is derived from Date.now(), never from frame counts, so a tab that
   was in the background (or a laptop that slept) shows the right time on return. */
const SW_MAX = 359999990;                     // 99:59:59.99
let mode = 'countdown';
let hour12 = (() => { try { return !!new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hour12; } catch (e) { return false; } })();
const cd = { parts: [0, 5, 0], dur: 300000, status: 'idle', endAt: 0, remain: 0 };
const sw = { status: 'idle', startAt: 0, acc: 0 };

function cdSetParts(h, m, s) { cd.parts = [h, m, s]; cd.dur = ((h * 60 + m) * 60 + s) * 1000; }
function cdRemaining(t) {
  if (cd.status === 'running') return Math.max(0, cd.endAt - t);
  if (cd.status === 'paused') return cd.remain;
  if (cd.status === 'finished') return 0;
  return cd.dur;
}
function cdCheck() {
  if (cd.status === 'running' && Date.now() >= cd.endAt) {
    cd.status = 'finished';
    sound.finish();
    changed();
  }
}
function cdPrimary() {
  cdCheck();
  const t = Date.now();
  if (cd.status === 'idle' || cd.status === 'finished') {
    if (cd.dur <= 0) return;
    cd.endAt = t + cd.dur; cd.status = 'running';
  } else if (cd.status === 'running') {
    cd.remain = Math.max(0, cd.endAt - t); cd.status = 'paused';
  } else if (cd.status === 'paused') {
    cd.endAt = t + cd.remain; cd.status = 'running';
  }
  sound.syncChime();
  changed();
}
function cdReset() { cdCheck(); cd.status = 'idle'; sound.syncChime(); changed(); }

function swElapsed(t) { return sw.acc + (sw.status === 'running' ? t - sw.startAt : 0); }
function swPrimary() {
  const t = Date.now();
  if (sw.status === 'running') { sw.acc += t - sw.startAt; sw.status = 'paused'; }
  else { if (sw.status === 'idle') sw.acc = 0; sw.startAt = t; sw.status = 'running'; }
  changed();
}
function swReset() { sw.status = 'idle'; sw.acc = 0; changed(); }

/* Pomodoro: the work and rest periods are laid end to end on one elapsed-time line, so which
   period is current is a pure function of how long the plan has been running. That keeps it
   right after any time in the background, and it shares no state with the other timers.
   A plan is N work periods with a rest between each pair; it ends when the last work period does. */
const pomo = { work: 25, rest: 5, sessions: 4, status: 'idle', startAt: 0, acc: 0, seen: 0 };
const pmW = () => pomo.work * 60000, pmR = () => pomo.rest * 60000;
const pmTotal = () => pomo.sessions * pmW() + (pomo.sessions - 1) * pmR();
function pmElapsed(t) { return pomo.status === 'running' ? pomo.acc + (t - pomo.startAt) : pomo.acc; }
function pmPhase(e) {                 // period index i: even = work, odd = rest
  const W = pmW(), cyc = W + pmR(), N = pomo.sessions, T = pmTotal();
  if (e >= T) return { i: 2 * N - 1, session: N, rest: false, remain: 0, end: T, done: true };
  const k = Math.floor(e / cyc), within = e - k * cyc;
  return within < W
    ? { i: 2 * k, session: k + 1, rest: false, remain: W - within, end: k * cyc + W, done: false }
    : { i: 2 * k + 1, session: k + 1, rest: true, remain: cyc - within, end: (k + 1) * cyc, done: false };
}
const pmPhaseEnd = i => { const cyc = pmW() + pmR(); return i % 2 ? (i + 1) / 2 * cyc : i / 2 * cyc + pmW(); };
function pmNextBoundary() {           // when the current period ends, as a wall-clock time
  if (pomo.status !== 'running') return null;
  const ph = pmPhase(pmElapsed(Date.now()));
  return ph.done ? null : { key: pomo.startAt + ph.end - pomo.acc, rest: ph.rest };
}
function pmCheck() {
  if (pomo.status !== 'running') return;
  const ph = pmPhase(pmElapsed(Date.now()));
  if (ph.i === pomo.seen && !ph.done) return;
  const last = ph.i - 1;              // the period that just ended
  pomoChime.passed(pomo.startAt + pmPhaseEnd(last) - pomo.acc, last % 2 === 1);
  pomo.seen = ph.i;
  if (ph.done) { pomo.status = 'finished'; pomo.acc = pmTotal(); }
  pomoChime.sync();
  changed();
}
function pmPrimary() {
  pmCheck();
  const t = Date.now();
  if (pomo.status === 'running') { pomo.acc = pmElapsed(t); pomo.status = 'paused'; }
  else {
    if (pomo.status !== 'paused') { pomo.acc = 0; pomo.seen = 0; }
    pomo.startAt = t; pomo.status = 'running';
  }
  pomoChime.sync(); changed();
}
function pmReset() { pomo.status = 'idle'; pomo.acc = 0; pomo.seen = 0; pomoChime.sync(); changed(); }
function pmSkip() {                   // jump to the start of the next period, silently
  pmCheck();
  if (pomo.status !== 'running' && pomo.status !== 'paused') return;
  const t = Date.now();
  pomo.acc = pmPhase(pmElapsed(t)).end; pomo.startAt = t;
  const nx = pmPhase(pomo.acc); pomo.seen = nx.i;
  if (nx.done) { pomo.status = 'finished'; pomo.acc = pmTotal(); }
  pomoChime.sync(); changed();
}
/* Season 2 of 3 Body Problem. Netflix announced Thursday, January 14, 2027 (Netflix Tudum,
   November 2026) without a time of day; Netflix releases new seasons at 12:00 AM Pacific, which
   is 08:00 UTC in January. Change this one line if the date moves. */
const SEASON2 = Date.UTC(2027, 0, 14, 8, 0, 0);
function longHms(total) {            // hours are not capped at 99 here: 1370:12:44
  const h = Math.min(99999, Math.floor(total / 3600)), m = Math.floor((total % 3600) / 60), sec = total % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(sec);
}
function seasonDays(r) { const d = Math.floor(r / 864e5); return d >= 2 ? d + ' days' : d === 1 ? '1 day' : ''; }
function seasonWhen(o) {
  try {
    return new Intl.DateTimeFormat(undefined, Object.assign({ weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: hour12 }, o)).format(new Date(SEASON2));
  } catch (e) { return ''; }
}
function seasonStatus() {

function pmStatusText() {

/* What the stage should show right now. */
const V = { main: '00:00:00', sub: '', speed: 1, inten: 1, flare: 1, lead: 0 };
function computeView(tNow, rt) {
  V.speed = 1; V.inten = 1; V.flare = 1; V.lead = 0; V.sub = '';
  if (mode === 'countdown') {
    V.main = hms(Math.ceil(cdRemaining(tNow) / 1000));
    if (cd.status === 'paused') { V.speed = 0.3; V.inten = 0.62; }
    else if (cd.status === 'finished') { V.speed = 1.2; V.flare = 2; V.inten = 0.86 + 0.14 * Math.sin(rt * 1.7); }
  } else if (mode === 'clock') {
    const d = new Date(tNow); let h = d.getHours();
    const tail = ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    if (hour12) {
      V.sub = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
      V.main = (h < 10 ? ' ' + h : '' + h) + tail; V.lead = h < 10 ? 1 : 0;
    } else V.main = pad2(h) + tail;

    const ms = Math.min(swElapsed(tNow), SW_MAX);
    V.main = hms(Math.floor(ms / 1000));
    V.sub = '.' + pad2(Math.floor(ms / 10) % 100);
    if (sw.status === 'paused') { V.speed = 0.3; V.inten = 0.66; }
  } else if (mode === 'season') {
    const r = SEASON2 - tNow;
    V.main = longHms(Math.max(0, Math.ceil(r / 1000)));
    V.sub = 'S2';
    if (r <= 0) { V.speed = 1.2; V.flare = 2; V.inten = 0.86 + 0.14 * Math.sin(rt * 1.7); }
  } else {
    const ph = pmPhase(pmElapsed(tNow));
    V.main = hms(Math.ceil(ph.remain / 1000));
    V.sub = ph.session + '/' + pomo.sessions;
    if (pomo.status === 'finished') { V.speed = 1.2; V.flare = 2; V.inten = 0.86 + 0.14 * Math.sin(rt * 1.7); }
    else if (pomo.status === 'paused') { V.speed = 0.3; V.inten = 0.62; }
    else if (pomo.status === 'running' && ph.rest) { V.speed = 0.6; V.inten = 0.8; }   // the flame settles while you rest
  }

}

/* ───────────────────────── sound ─────────────────────────

   the fifth, and a low-passed saw pair for warmth. All of it sits under a fixed low-pass, so the

  ['Deep hum',     { root: 33, sub: 70, octave: 35, fifth: 20, warmth: 40, rate: 0.8,  depth: 50, shimmer: 0 }],
  ['Slow tide',    { root: 29, sub: 85, octave: 25, fifth: 35, warmth: 30, rate: 0.25, depth: 75, shimmer: 0 }],
  ['Engine room',  { root: 26, sub: 60, octave: 55, fifth: 10, warmth: 75, rate: 2.4,  depth: 45, shimmer: 0 }],
  ['Hollow fifth', { root: 31, sub: 50, octave: 30, fifth: 75, warmth: 25, rate: 0.5,  depth: 35, shimmer: 0 }],

   the fifth above it, one per second. They are rendered once into a two-second loop. */

/* countdown fields: whole numbers only, never negative, never past the field's range */

/* sound desk */
const SLIDERS = {

function syncSliders() {

for (const k in SLIDERS) {

ORBITS.forEach(o => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn small'; b.textContent = o[1]; b.dataset.bg = o[0]; b.id = 'bg-' + o[0];

els.soundToggle.addEventListener('click', () => sound.setOn(!sound.on));
function setTuning(open) {

  els.tune.setAttribute('aria-expanded', String(open));
}
els.tune.addEventListener('click', () => setTuning(els.panel.hidden));

/* full screen, with the chrome fading out while idle */
let immersive = false, idleTimer = 0;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  if (!immersive) return;
  idleTimer = setTimeout(() => {
    const a = document.activeElement;
    let keyboard = false;
    try { keyboard = !!a && a !== document.body && a.matches(':focus-visible'); } catch (e) {}
    if (immersive && !keyboard) document.body.classList.add('idle'); else wake();
  }, 3500);
}
function setImmersive(v) {
  immersive = v;
  els.fs.textContent = v ? 'Exit full screen' : 'Full screen'; els.fs.setAttribute('aria-pressed', String(v));
  wake(); syncWake();
}

    try { if (req) await req.call(root); } catch (e) {}

els.fs.addEventListener('click', toggleFullscreen);
['fullscreenchange', 'webkitfullscreenchange'].forEach(n => document.addEventListener(n, () => { if (!fsEl() && immersive) setImmersive(false); }));
['pointermove', 'pointerdown', 'keydown', 'touchstart', 'focusin'].forEach(n => document.addEventListener(n, wake, { passive: true }));

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if (e.key === 'Escape') {
    if (immersive && !fsEl()) setImmersive(false);
    else if (!els.panel.hidden) { setTuning(false); els.tune.focus(); }
    return;
  }
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const key = e.key.toLowerCase();
  if (key === ' ') {
    if (tag === 'BUTTON') return;
    if (mode === 'countdown') cdPrimary(); else if (mode === 'stopwatch') swPrimary(); else if (mode === 'pomodoro') pmPrimary(); else return;
    e.preventDefault();

/* keep the screen awake while something is running or the page is full screen */
let wakeLock = null;

  const want = document.visibilityState === 'visible' && (immersive || cd.status === 'running' || sw.status === 'running' || pomo.status === 'running');

    if (want && !wakeLock && navigator.wakeLock) {

/* a slow timer covers what animation frames cannot do in a background tab */

  const t = Date.now(), pmT = pmTitleText(t); let title = BASE_TITLE;
  if (mode === 'season') title = SEASON2 > t ? longHms(Math.ceil((SEASON2 - t) / 1000)) + ' · Season 2' : 'Season 2 is out';
  else if (mode === 'pomodoro' && pmT) title = pmT;

  else if (pmT) title = pmT;

document.addEventListener('visibilitychange', () => { cdCheck(); pmCheck(); syncWake(); });

/* ───────────────────────── start ───────────────────────── */
let started = false;

else start((hot && hot.data) || {});
